<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-labelledby="t d">
<title id="t">交互改动：静态界面变成可反馈的状态交互</title><desc id="d">按钮被点击后从 Idle 变成 Loading 再变成 Done。</desc>

<style>
  .bg{fill:#F8F7F2}.paper{fill:#fff}.line{stroke:#D1CFC5;stroke-width:2}.muted{fill:#87867F}
  .ink{fill:#141413}.clay{fill:#D97757}.soft{fill:#E6E3DA}.accentSoft{fill:#FBF0EC}
  .olive{fill:#788C5D}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .sans{font-family:system-ui,-apple-system,Segoe UI,sans-serif}
  text{dominant-baseline:middle}
</style>
<rect width="760" height="380" rx="28" class="bg"/>
<text x="42" y="42" class="mono muted" font-size="13">LIVE CHANGE · INTERACTION</text>
<text x="42" y="72" class="sans ink" font-size="24" font-weight="650">BEFORE → NOW</text>
<rect x="110" y="112" width="540" height="210" rx="18" class="paper line"/>
<rect x="145" y="146" width="250" height="42" rx="10" fill="#fff" stroke="#D1CFC5"/>
<text x="166" y="167" class="sans muted" font-size="14">搜索关键词</text>
<rect x="420" y="146" width="92" height="42" rx="10" fill="#fff" stroke="#3D3D3A" stroke-width="2">
 <animate attributeName="fill" values="#fff;#fff;#FBF0EC;#FBF0EC" keyTimes="0;0.3333333333333333;0.6666666666666666;1" dur="6s" repeatCount="1" fill="freeze"/>
 <animate attributeName="stroke" values="#3D3D3A;#3D3D3A;#D97757;#788C5D" keyTimes="0;0.3333333333333333;0.6666666666666666;1" dur="6s" repeatCount="1" fill="freeze"/>
</rect>
<text x="466" y="167" text-anchor="middle" class="sans ink" font-size="14" font-weight="650">搜索</text>
<g><text x="145" y="232" class="mono muted" font-size="12">BEFORE · 点击后没有状态反馈</text><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.28;0.48;1" dur="6s" repeatCount="1" fill="freeze"/></g>
<g opacity="0"><circle cx="168" cy="232" r="9" fill="none" stroke="#D97757" stroke-width="3" stroke-dasharray="14 8"><animateTransform attributeName="transform" type="rotate" from="0 168 232" to="360 168 232" dur=".9s" repeatCount="1" fill="freeze"/></circle><text x="188" y="232" class="mono clay" font-size="12">NOW · 正在搜索…</text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.28;0.52;1" dur="6s" repeatCount="1" fill="freeze"/></g>
<g opacity="0"><circle cx="168" cy="232" r="10" fill="#788C5D"/><path d="M163 232l4 4 7-9" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/><text x="188" y="232" class="mono olive" font-size="12">NOW · 找到 12 个结果</text><rect x="145" y="260" width="370" height="34" rx="8" fill="#F0EEE6"/><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.28;0.52;1" dur="6s" repeatCount="1" fill="freeze"/></g>
<circle cx="466" cy="167" r="5" fill="#D97757" opacity="0"><animate attributeName="r" values="5;22;5" dur=".7s" begin="1.25s;7.25s;13.25s" repeatCount="1"/><animate attributeName="opacity" values=".6;0;0" dur=".7s" begin="1.25s;7.25s;13.25s" repeatCount="1"/></circle>
</svg>