<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-labelledby="t d">
<title id="t">Agent Handoff：大段说明变成 Primary Source 指针</title>
<desc id="d">BEFORE 是冗长 handoff 文档，NOW 是小型索引，指向 runnable prototype、screens、flow 和 acceptance。</desc>
<style>
.bg{fill:#F8F7F2}.paper{fill:#fff}.line{stroke:#D1CFC5;stroke-width:2}.muted{fill:#87867F}.ink{fill:#141413}.clay{fill:#D97757}.soft{fill:#E6E3DA}.accent{fill:#FBF0EC}.olive{fill:#788C5D}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.sans{font-family:system-ui,-apple-system,Segoe UI,sans-serif} text{dominant-baseline:middle}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#D97757"/></marker></defs>
<rect width="760" height="380" rx="28" class="bg"/>
<text x="42" y="42" class="mono muted" font-size="13">LIVE CHANGE · AGENT HANDOFF</text>
<text x="42" y="72" class="sans ink" font-size="24" font-weight="650">BEFORE → NOW</text>
<g>
 <rect x="74" y="118" width="250" height="200" rx="14" class="paper line"/>
 <text x="98" y="144" class="mono muted" font-size="10">HANDOFF.md · 10,000 WORDS</text>
 <rect x="98" y="169" width="200" height="8" rx="4" class="soft"/><rect x="98" y="188" width="182" height="8" rx="4" class="soft"/><rect x="98" y="207" width="194" height="8" rx="4" class="soft"/><rect x="98" y="226" width="168" height="8" rx="4" class="soft"/><rect x="98" y="245" width="201" height="8" rx="4" class="soft"/><rect x="98" y="264" width="179" height="8" rx="4" class="soft"/>
 <text x="98" y="293" class="sans muted" font-size="12">重复描述 prototype</text>
 <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.28;0.48;1" dur="5.5s" repeatCount="1" fill="freeze"/>
</g>
<path d="M346 218H409" stroke="#D97757" stroke-width="3" marker-end="url(#a)"/>
<g opacity="0">
 <rect x="434" y="118" width="252" height="200" rx="18" fill="#fff" stroke="#D97757" stroke-width="2"/>
 <text x="458" y="144" class="mono clay" font-size="10">HANDOFF · SMALL INDEX</text>
 <rect x="458" y="166" width="204" height="28" rx="9" fill="#FBF0EC"/><text x="472" y="180" class="sans ink" font-size="11">① Human decision</text>
 <rect x="458" y="202" width="204" height="28" rx="9" fill="#F0EEE6"/><text x="472" y="216" class="sans ink" font-size="11">② Prototype URL + commit</text>
 <rect x="458" y="238" width="204" height="28" rx="9" fill="#F0EEE6"/><text x="472" y="252" class="sans ink" font-size="11">③ Screens + Flows</text>
 <rect x="458" y="274" width="204" height="28" rx="9" fill="#F3F6EE"/><text x="472" y="288" class="sans ink" font-size="11">④ Acceptance evidence</text>
 <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.28;0.52;1" dur="5.5s" repeatCount="1" fill="freeze"/>
</g>
</svg>