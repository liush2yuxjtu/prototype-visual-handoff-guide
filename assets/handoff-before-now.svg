<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" role="img" aria-labelledby="t d">
  <title id="t">Agent Handoff Before to Now Progressive SVG Diff</title>
  <desc id="d">Two-artifact Before to Now progressive line-draw SVG diff. The Before artifact stays visible on the left while the Now artifact is progressively drawn on the right.</desc>
  <style>
    .bg{fill:#FAF9F5}.card{fill:#fff;stroke:#D1CFC5;stroke-width:2}.muted{fill:#87867F}.ink{fill:#141413}.clay{fill:#B85C3E}
    .label{font:700 12px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em}.title{font:600 19px system-ui,-apple-system,Segoe UI,sans-serif}
    .body{font:13px system-ui,-apple-system,Segoe UI,sans-serif}.line{stroke:#3D3D3A;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .soft{stroke:#D1CFC5;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .now{stroke:#D97757}.fillNow{fill:#FBF0EC;stroke:#D97757;stroke-width:2}.fillSoft{fill:#fff;stroke:#D1CFC5;stroke-width:2}
    .draw{fill:none;stroke:#D97757;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1}
    .drawSoft{fill:none;stroke:#3D3D3A;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1}
    .fade{opacity:0}.arrow{stroke:#87867F;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1}
    @media (prefers-reduced-motion:reduce){.draw,.drawSoft,.arrow{stroke-dashoffset:0}.fade{opacity:1}}
  </style>
  <rect class="bg" width="920" height="420" rx="24"/>
  <text x="52" y="48" class="label muted">BEFORE</text>
  <text x="584" y="48" class="label clay">NOW</text>
  <text x="52" y="79" class="title ink">Long narrative → compact pointer packet</text>
  <g transform="translate(52 105)">
    <rect x="0" y="0" width="280" height="205" rx="12" class="card"/><path d="M24 32 H220 M24 56 H248 M24 80 H230 M24 104 H242 M24 128 H206 M24 152 H238 M24 176 H168" class="soft"/></g>
  <g>
    <path class="arrow" pathLength="1" d="M420 210 H500"><animate attributeName="stroke-dashoffset" from="1" to="0" dur=".6s" begin=".25s" fill="freeze"/></path>
    <path class="arrow" pathLength="1" d="M489 199 L500 210 L489 221"><animate attributeName="stroke-dashoffset" from="1" to="0" dur=".35s" begin=".68s" fill="freeze"/></path>
  </g>
  <g transform="translate(584 105)">
    <rect x="0" y="0" width="280" height="205" rx="14" class="draw" pathLength="1"><animate attributeName="stroke-dashoffset" from="1" to="0" dur=".6s" begin="1s" fill="freeze"/></rect>
    <path d="M24 34 H138" class="draw" pathLength="1"><animate attributeName="stroke-dashoffset" from="1" to="0" dur=".3s" begin="1.55s" fill="freeze"/></path>
    <path d="M24 65 H52" class="drawSoft" pathLength="1"><animate attributeName="stroke-dashoffset" from="1" to="0" dur=".18s" begin="1.82s" fill="freeze"/></path>
    <path d="M66 65 H238" class="drawSoft" pathLength="1"><animate attributeName="stroke-dashoffset" from="1" to="0" dur=".38s" begin="1.95s" fill="freeze"/></path>
    <path d="M24 96 H52" class="drawSoft" pathLength="1"><animate attributeName="stroke-dashoffset" from="1" to="0" dur=".18s" begin="2.25s" fill="freeze"/></path>
    <path d="M66 96 H214" class="drawSoft" pathLength="1"><animate attributeName="stroke-dashoffset" from="1" to="0" dur=".38s" begin="2.38s" fill="freeze"/></path>
    <path d="M24 127 H52" class="drawSoft" pathLength="1"><animate attributeName="stroke-dashoffset" from="1" to="0" dur=".18s" begin="2.68s" fill="freeze"/></path>
    <path d="M66 127 H230" class="drawSoft" pathLength="1"><animate attributeName="stroke-dashoffset" from="1" to="0" dur=".38s" begin="2.82s" fill="freeze"/></path>
    <rect x="24" y="150" width="134" height="32" rx="8" class="draw" pathLength="1"><animate attributeName="stroke-dashoffset" from="1" to="0" dur=".4s" begin="3.12s" fill="freeze"/></rect>
    <text x="91" y="171" text-anchor="middle" class="body clay fade">Primary Source ↗<animate attributeName="opacity" from="0" to="1" dur=".25s" begin="3.48s" fill="freeze"/></text></g>
  <text x="52" y="392" class="body muted">Before remains visible · Now is progressively generated line by line</text>
</svg>