<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" role="img" aria-labelledby="t d">
  <title id="t">Wireflow Before to Now Progressive SVG Diff</title>
  <desc id="d">Two-artifact Before to Now progressive line-draw SVG diff. The Before artifact stays visible on the left while the Now artifact is progressively drawn on the right.</desc>
  <style>
    .bg{fill:#FAF9F5}.card{fill:#fff;stroke:#D1CFC5;stroke-width:2}.muted{fill:#87867F}.ink{fill:#141413}.clay{fill:#B85C3E}
    .label{font:700 12px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em}.title{font:600 19px system-ui,-apple-system,Segoe UI,sans-serif}
    .body{font:13px system-ui,-apple-system,Segoe UI,sans-serif}.line{stroke:#3D3D3A;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .soft{stroke:#D1CFC5;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .now{stroke:#D97757}.fillNow{fill:#FBF0EC;stroke:#D97757;stroke-width:2}.fillSoft{fill:#fff;stroke:#D1CFC5;stroke-width:2}
    .draw{fill:none;stroke:#D97757;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1}
    .drawSoft{fill:none;stroke:#3D3D3A;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1}
    .fade{opacity:0}.arrow{stroke:#87867F;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1}
    @media (prefers-reduced-motion:reduce){.draw,.drawSoft,.arrow{stroke-dashoffset:0}.fade{opacity:1}}
  </style>
  <rect class="bg" width="920" height="420" rx="24"/>
  <text x="52" y="48" class="label muted">BEFORE</text>
  <text x="584" y="48" class="label clay">NOW</text>
  <text x="52" y="79" class="title ink">Two-step flow → explicit state sequence</text>
  <g transform="translate(52 105)">
    <rect x="0" y="28" width="95" height="135" rx="10" class="card"/><rect x="20" y="50" width="55" height="8" rx="4" fill="#D1CFC5"/><rect x="20" y="75" width="55" height="36" rx="6" class="fillSoft"/>
    <path d="M108 95 H144" class="soft"/><path d="M135 86 L144 95 L135 104" class="soft"/>
    <rect x="158" y="28" width="95" height="135" rx="10" class="card"/><rect x="178" y="50" width="55" height="8" rx="4" fill="#D1CFC5"/><rect x="178" y="75" width="55" height="36" rx="6" class="fillSoft"/></g>
  <g>
    <path class="arrow" pathLength="1" d="M420 210 H500"><animate attributeName="stroke-dashoffset" from="1" to="0" dur=".6s" begin=".25s" fill="freeze"/></path>
    <path class="arrow" pathLength="1" d="M489 199 L500 210 L489 221"><animate attributeName="stroke-dashoffset" from="1" to="0" dur=".35s" begin=".68s" fill="freeze"/></path>
  </g>
  <g transform="translate(584 105)">
    <rect x="0" y="28" width="62" height="135" rx="9" class="draw" pathLength="1"><animate attributeName="stroke-dashoffset" from="1" to="0" dur=".45s" begin="1s" fill="freeze"/></rect>
    <path d="M12 54 H48 M12 77 H48" class="drawSoft" pathLength="1"><animate attributeName="stroke-dashoffset" from="1" to="0" dur=".3s" begin="1.4s" fill="freeze"/></path>
    <path d="M70 95 H86" class="drawSoft" pathLength="1"><animate attributeName="stroke-dashoffset" from="1" to="0" dur=".2s" begin="1.65s" fill="freeze"/></path>
    <rect x="94" y="28" width="62" height="135" rx="9" class="draw" pathLength="1"><animate attributeName="stroke-dashoffset" from="1" to="0" dur=".45s" begin="1.8s" fill="freeze"/></rect>
    <path d="M106 54 H142 M106 77 H142" class="drawSoft" pathLength="1"><animate attributeName="stroke-dashoffset" from="1" to="0" dur=".3s" begin="2.2s" fill="freeze"/></path>
    <path d="M164 95 H180" class="drawSoft" pathLength="1"><animate attributeName="stroke-dashoffset" from="1" to="0" dur=".2s" begin="2.45s" fill="freeze"/></path>
    <rect x="188" y="28" width="62" height="135" rx="9" class="draw" pathLength="1"><animate attributeName="stroke-dashoffset" from="1" to="0" dur=".45s" begin="2.6s" fill="freeze"/></rect>
    <path d="M200 54 H236 M200 77 H236 M200 100 H236" class="drawSoft" pathLength="1"><animate attributeName="stroke-dashoffset" from="1" to="0" dur=".4s" begin="3s" fill="freeze"/></path>
    <text x="31" y="184" text-anchor="middle" class="body muted fade">Idle<animate attributeName="opacity" from="0" to="1" dur=".2s" begin="3.3s" fill="freeze"/></text>
    <text x="125" y="184" text-anchor="middle" class="body muted fade">Loading<animate attributeName="opacity" from="0" to="1" dur=".2s" begin="3.45s" fill="freeze"/></text>
    <text x="219" y="184" text-anchor="middle" class="body clay fade">Results<animate attributeName="opacity" from="0" to="1" dur=".2s" begin="3.6s" fill="freeze"/></text></g>
  <text x="52" y="392" class="body muted">Before remains visible · Now is progressively generated line by line</text>
</svg>